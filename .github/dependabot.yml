version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - ready-for-agent
    open-pull-requests-limit: 5
  # requirements-dev.txt includes ../requirements-pdf.txt; pypdf is bumped from / only.
  - package-ecosystem: pip
    directory: /reminders
    schedule:
      interval: weekly
    labels:
      - ready-for-agent
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: pypdf
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ready-for-agent
    open-pull-requests-limit: 5
