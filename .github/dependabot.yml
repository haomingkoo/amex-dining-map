version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/"
      - "/reminders"
    schedule:
      interval: weekly
    labels:
      - ready-for-agent
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ready-for-agent
    open-pull-requests-limit: 5
