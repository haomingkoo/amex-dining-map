name: Refresh Data

on:
  schedule:
    # 05:00 Singapore time, so daily data is fresh before the morning.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: source-ledger-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Sync Japan dining
        id: japan_refresh
        env:
          PYTHONUNBUFFERED: "1"
        run: /usr/bin/time -p python3 scripts/sync_japan_mvp.py

      - name: Refresh Pocket Concierge availability
        id: pocket_refresh
        env:
          PYTHONUNBUFFERED: "1"
        run: /usr/bin/time -p python3 scripts/scrape_pocket_availability.py

      - name: Build Japan Dining source alert
        id: japan_alert
        run: |
          python3 scripts/source_change_alert.py \
            --program "Japan Dining" \
            --meta data/japan-dining-source.json \
            --data data/japan-restaurants.json \
            --output /tmp/japan-dining-alert.md \
            --changelog data/changelog-japan-dining.md \
            --updates data/updates.json

      - name: Sync Plat Stay
        id: plat_stay_refresh
        env:
          PYTHONUNBUFFERED: "1"
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: /usr/bin/time -p python3 scripts/sync_plat_stay.py

      - name: Build Plat Stay source alert
        id: plat_stay_alert
        run: |
          python3 scripts/source_change_alert.py \
            --program "Plat Stay" \
            --meta data/plat-stay-source.json \
            --data data/plat-stays.json \
            --output /tmp/plat-stay-alert.md \
            --changelog data/changelog-plat-stay.md \
            --updates data/updates.json

      - name: Finalize source health
        if: always()
        run: |
          # A source whose steps never ran was not attempted, so it gets no outcome.
          outcome_of() {
            case " $* " in
              *" failure "*|*" cancelled "*) echo failure ;;
              *" skipped "*) echo skipped ;;
              *) echo success ;;
            esac
          }
          record() {
            if [ "$2" = "skipped" ]; then
              echo "::warning::$1 refresh did not run; leaving its source health unchanged."
            else
              python3 scripts/build_source_health.py --source "$1" --attempt-outcome "$2"
            fi
          }
          record japan-dining "$(outcome_of ${{ steps.japan_refresh.outcome }} ${{ steps.pocket_refresh.outcome }} ${{ steps.japan_alert.outcome }})"
          record plat-stay "$(outcome_of ${{ steps.plat_stay_refresh.outcome }} ${{ steps.plat_stay_alert.outcome }})"

      - name: Commit refreshed data
        env:
          COMMIT_MESSAGE: "chore: refresh explorer data"
          MUST_STAGE: |
            data/japan-restaurants.json
            data/japan-restaurants.geojson
            data/japan-dining-source.json
            data/geocode_cache.json
            data/venue_detail_cache.json
            data/pocket-availability.json
            data/changelog-japan-dining.md
            data/plat-stays.json
            data/plat-stays.geojson
            data/plat-stay-source.json
            data/plat_stay_geocode_cache.json
            data/changelog-plat-stay.md
            data/kml/japan-all.kml
            data/kml/tokyo.kml
            data/kml/kyoto.kml
            data/kml/osaka.kml
            data/kml/plat-stays-all.kml
            data/source-health.json
            data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Commit source health
        # Success paths ship health in the data commit; this records failed runs.
        if: failure()
        env:
          COMMIT_MESSAGE: "chore: record explorer source health"
          MUST_STAGE: |
            data/source-health.json
            data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Dispatch published owner updates
        if: always()
        id: owner_dispatch
        env:
          OWNER_ALERT_INGEST_URL: ${{ secrets.OWNER_ALERT_INGEST_URL }}
          OWNER_ALERT_INGEST_TOKEN: ${{ secrets.OWNER_ALERT_INGEST_TOKEN }}
        run: python3 scripts/dispatch_owner_updates.py

      - name: Commit owner delivery receipts
        if: always() && steps.owner_dispatch.outcome != 'skipped'
        env:
          COMMIT_MESSAGE: "chore: record owner alert delivery"
          MUST_STAGE: data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Open Plat Stay alert issue
        if: always() && steps.plat_stay_alert.outputs.alert_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open_source_alert_issue.sh \
            "Plat Stay source changed: review required" \
            /tmp/plat-stay-alert.md \
            plat-stay

      - name: Open Japan Dining alert issue
        if: always() && steps.japan_alert.outputs.alert_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open_source_alert_issue.sh \
            "Japan Dining source changed: review required" \
            /tmp/japan-dining-alert.md \
            japan-dining
