name: Refresh Love Dining

on:
  schedule:
    # 05:45 Singapore time, so daily data is fresh before the morning.
    - cron: "45 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: source-ledger-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.62.0 pypdf==6.16.2
          playwright install --with-deps chromium

      - name: Refresh official Love Dining snapshot
        id: source_refresh
        run: python3 scripts/scrape_love_dining.py

      - name: Audit content provenance
        run: python3 scripts/audit_content_provenance.py

      - name: Verify reviewed Love Dining documents
        run: python3 -m scripts.verify_love_dining_documents

      - name: Verify Love Dining map pins
        run: python3 scripts/tests/test_love_dining_map_pins.py

      - name: Build Love Dining source alert
        id: love_alert
        run: |
          python3 scripts/source_change_alert.py \
            --program "Love Dining" \
            --meta data/love-dining-source.json \
            --data data/love-dining.json \
            --output /tmp/love-dining-alert.md \
            --changelog data/changelog-love-dining.md \
            --updates data/updates.json

      - name: Commit refreshed Love Dining data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/love-dining.json data/love-dining-source.json data/updates.json
          if [ -f data/changelog-love-dining.md ]; then
            git add data/changelog-love-dining.md
          fi
          if git diff --cached --quiet; then
            echo "No Love Dining changes detected."
            exit 0
          fi
          git commit -m "chore: refresh love dining data"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after remote sync."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Finalize source health
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            outcome=success
          else
            outcome=failure
          fi
          python3 scripts/build_source_health.py --source love-dining --attempt-outcome "$outcome"

      - name: Commit source health
        if: always()
        env:
          COMMIT_MESSAGE: "chore: record love dining source health"
          MUST_STAGE: |
            data/source-health.json
            data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Dispatch published owner updates
        if: always()
        id: owner_dispatch
        env:
          OWNER_ALERT_INGEST_URL: ${{ secrets.OWNER_ALERT_INGEST_URL }}
          OWNER_ALERT_INGEST_TOKEN: ${{ secrets.OWNER_ALERT_INGEST_TOKEN }}
        run: python3 scripts/dispatch_owner_updates.py

      - name: Commit owner delivery receipts
        if: always() && steps.owner_dispatch.outcome != 'skipped'
        env:
          COMMIT_MESSAGE: "chore: record owner alert delivery"
          MUST_STAGE: data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Open Love Dining alert issue
        if: always() && steps.love_alert.outputs.alert_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open_source_alert_issue.sh \
            "Love Dining source changed: review required" \
            /tmp/love-dining-alert.md \
            love-dining
