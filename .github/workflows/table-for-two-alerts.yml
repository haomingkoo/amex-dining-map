name: Table for Two Alerts

on:
  schedule:
    # Requested every 15 minutes, but GitHub's scheduler queues this workflow:
    # measured delivery is ~10 runs/day with 1-5h gaps. Treat 15 minutes as an
    # upper bound on request frequency, not a freshness guarantee.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Reads the previous run's start time to bound when new dates appeared.
  actions: read

concurrency:
  group: table-for-two-availability-refresh
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check alert configuration
        id: config
        env:
          REMINDERS_API_BASE: ${{ secrets.REMINDERS_API_BASE }}
          ALERT_EXPORT_TOKEN: ${{ secrets.ALERT_EXPORT_TOKEN }}
          ALERT_HASH_SALT: ${{ secrets.ALERT_HASH_SALT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$REMINDERS_API_BASE" ] && [ -n "$ALERT_EXPORT_TOKEN" ] && [ -n "$ALERT_HASH_SALT" ] && [ -n "$RESEND_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Alert secrets are not fully configured; skipping email run."
          fi

      # Railway owns live availability; the daily "Refresh Table for Two" keeps the committed fallback.
      - name: Read live Table for Two availability
        id: live_availability
        continue-on-error: true
        env:
          REMINDERS_API_BASE: ${{ secrets.REMINDERS_API_BASE }}
        run: python3 scripts/tft_live_availability.py --output /tmp/table-for-two-live.json

      - name: Track first-seen release patterns
        id: release_patterns
        if: always() && steps.live_availability.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without it new dates are still recorded, just without a check window.
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow table-for-two-alerts.yml \
            --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""' || true)"
          python3 scripts/track_table_for_two_releases.py --data /tmp/table-for-two-live.json \
            ${previous:+--previous-run-at "$previous"}

      - name: Rebuild Telegram release catalogue
        id: guide_catalogue
        if: always()
        continue-on-error: true
        run: python3 scripts/build_tft_guide_catalog.py

      - name: Send matching alert emails
        id: alerts
        if: always() && steps.config.outputs.enabled == 'true' && steps.live_availability.outcome == 'success'
        continue-on-error: true
        env:
          REMINDERS_API_BASE: ${{ secrets.REMINDERS_API_BASE }}
          ALERT_EXPORT_TOKEN: ${{ secrets.ALERT_EXPORT_TOKEN }}
          ALERT_HASH_SALT: ${{ secrets.ALERT_HASH_SALT }}
          ALERT_SITE_URL: https://amex-explorer.kooexperience.com/#/table-for-two
          ALERT_ONE_CLICK_UNSUBSCRIBE: ${{ secrets.ALERT_ONE_CLICK_UNSUBSCRIBE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: python3 scripts/send_table_for_two_alerts.py --data /tmp/table-for-two-live.json

      # commit_and_push.sh no-ops when nothing is staged, so quiet runs make no commit.
      - name: Commit alert state and new release observations
        id: data_commit
        if: always()
        continue-on-error: true
        env:
          COMMIT_MESSAGE: "chore: record table for two alert state"
          MUST_STAGE: |
            data/table-for-two-alert-sent.json
            data/table-for-two-release-history.json
            reminders/app/tft_guide_catalog.json
          KEEP_LOCAL_ON_CONFLICT: |
            data/table-for-two-alert-sent.json
            data/table-for-two-release-history.json
            reminders/app/tft_guide_catalog.json
        run: |
          bash scripts/commit_and_push.sh

      - name: Fail after preserving alert evidence
        if: always()
        env:
          LIVE_AVAILABILITY_OUTCOME: ${{ steps.live_availability.outcome }}
          RELEASE_PATTERNS_OUTCOME: ${{ steps.release_patterns.outcome }}
          GUIDE_CATALOGUE_OUTCOME: ${{ steps.guide_catalogue.outcome }}
          EMAIL_ALERTS_OUTCOME: ${{ steps.alerts.outcome }}
          DATA_COMMIT_OUTCOME: ${{ steps.data_commit.outcome }}
        run: |
          failed=()
          for stage in LIVE_AVAILABILITY RELEASE_PATTERNS GUIDE_CATALOGUE DATA_COMMIT; do
            outcome_name="${stage}_OUTCOME"
            outcome="${!outcome_name}"
            if [ "$outcome" != "success" ]; then
              failed+=("${stage,,}=${outcome:-missing}")
            fi
          done
          if [ "$EMAIL_ALERTS_OUTCOME" = "failure" ]; then
            failed+=("email_alerts=failure")
          fi
          if [ "${#failed[@]}" -gt 0 ]; then
            summary="Table for Two alert run completed with failures: ${failed[*]}"
            echo "::error::$summary"
            echo "### Table for Two alert run needs attention" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
