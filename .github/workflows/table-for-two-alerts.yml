name: Table for Two Alerts

on:
  schedule:
    # Refresh well inside the 30-minute public freshness window.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: table-for-two-availability-refresh
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check alert configuration
        id: config
        env:
          REMINDERS_API_BASE: ${{ secrets.REMINDERS_API_BASE }}
          ALERT_EXPORT_TOKEN: ${{ secrets.ALERT_EXPORT_TOKEN }}
          ALERT_HASH_SALT: ${{ secrets.ALERT_HASH_SALT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$REMINDERS_API_BASE" ] && [ -n "$ALERT_EXPORT_TOKEN" ] && [ -n "$ALERT_HASH_SALT" ] && [ -n "$RESEND_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Alert secrets are not fully configured; skipping email run."
          fi

      - name: Refresh Table for Two availability
        id: source_refresh
        run: python3 scripts/scrape_table_for_two.py --availability-only

      - name: Build bounded Table for Two slot snapshot
        run: python3 scripts/build_tft_slot_snapshot.py

      - name: Track first-seen release patterns
        run: python3 scripts/track_table_for_two_releases.py

      - name: Rebuild Telegram release catalogue
        run: python3 scripts/build_tft_guide_catalog.py

      - name: Send matching alert emails
        id: alerts
        if: steps.config.outputs.enabled == 'true'
        continue-on-error: true
        env:
          REMINDERS_API_BASE: ${{ secrets.REMINDERS_API_BASE }}
          ALERT_EXPORT_TOKEN: ${{ secrets.ALERT_EXPORT_TOKEN }}
          ALERT_HASH_SALT: ${{ secrets.ALERT_HASH_SALT }}
          ALERT_SITE_URL: https://amex-explorer.kooexperience.com/#/table-for-two
          ALERT_ONE_CLICK_UNSUBSCRIBE: ${{ secrets.ALERT_ONE_CLICK_UNSUBSCRIBE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: python3 scripts/send_table_for_two_alerts.py

      - name: Commit refreshed availability and alert state
        if: always()
        env:
          COMMIT_MESSAGE: "chore: refresh table for two availability"
          MUST_STAGE: |
            data/table-for-two.json
            data/table-for-two-slots.json
            data/table-for-two-release-history.json
            data/table-for-two-alert-sent.json
            reminders/app/tft_guide_catalog.json
          KEEP_LOCAL_ON_CONFLICT: |
            data/table-for-two.json
            data/table-for-two-slots.json
            data/table-for-two-release-history.json
            data/table-for-two-alert-sent.json
            reminders/app/tft_guide_catalog.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Finalize source health
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            outcome=success
          else
            outcome=failure
          fi
          python3 scripts/build_source_health.py --source table-for-two-availability --attempt-outcome "$outcome"

      - name: Commit source health
        if: always()
        env:
          COMMIT_MESSAGE: "chore: record Table for Two availability health"
          MUST_STAGE: |
            data/source-health.json
            data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Dispatch published owner updates
        if: always()
        id: owner_dispatch
        env:
          OWNER_ALERT_INGEST_URL: ${{ secrets.OWNER_ALERT_INGEST_URL }}
          OWNER_ALERT_INGEST_TOKEN: ${{ secrets.OWNER_ALERT_INGEST_TOKEN }}
        run: python3 scripts/dispatch_owner_updates.py

      - name: Commit owner delivery receipts
        if: always() && steps.owner_dispatch.outcome != 'skipped'
        env:
          COMMIT_MESSAGE: "chore: record owner alert delivery"
          MUST_STAGE: data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Report alert delivery failure
        if: always() && steps.alerts.outcome == 'failure'
        run: |
          echo "Availability was refreshed and committed, but alert delivery failed." >&2
          exit 1
