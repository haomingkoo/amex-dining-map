name: Refresh Global Dining Data

on:
  schedule:
    # 05:30 Singapore time, so the public directory is refreshed daily before the morning.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh scope"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - terms

concurrency:
  group: source-ledger-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run scraper
        id: source_refresh
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "terms" ]]; then
            python3 scripts/scrape_global_dining.py --terms-only
          else
            python3 scripts/scrape_global_dining.py
          fi

      - name: Verify against official Amex API
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "terms" ]]; then
            echo "Skipping restaurant API verification for terms-only refresh."
          else
            python3 scripts/verify_global_dining_official.py --all
          fi

      - name: Audit map coordinates
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "terms" ]]; then
            echo "Skipping coordinate audit for terms-only refresh."
          else
            python3 scripts/audit_coordinates.py
          fi

      - name: Audit content provenance
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "terms" ]]; then
            echo "Skipping content provenance audit for terms-only refresh."
          else
            python3 scripts/audit_content_provenance.py
          fi

      - name: Build Global Dining source alert
        id: global_alert
        run: |
          python3 scripts/source_change_alert.py \
            --program "Global Dining" \
            --meta data/global-dining-source.json \
            --data data/global-restaurants.json \
            --output /tmp/global-dining-alert.md \
            --changelog data/changelog-global-dining.md \
            --updates data/updates.json

      - name: Commit updated data
        env:
          COMMIT_MESSAGE: "chore: refresh global dining data"
          MUST_STAGE: |
            data/global-restaurants.json
            data/global-dining-source.json
            data/global-dining-geocode-cache.json
            data/changelog-global-dining.md
            data/updates.json
          KEEP_LOCAL_ON_CONFLICT: |
            data/global-dining-geocode-cache.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Finalize source health
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            outcome=success
          else
            outcome=failure
          fi
          python3 scripts/build_source_health.py --source global-dining --attempt-outcome "$outcome"

      - name: Commit source health
        if: always()
        env:
          COMMIT_MESSAGE: "chore: record global dining source health"
          MUST_STAGE: |
            data/source-health.json
            data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Dispatch published owner updates
        if: always()
        id: owner_dispatch
        env:
          OWNER_ALERT_INGEST_URL: ${{ secrets.OWNER_ALERT_INGEST_URL }}
          OWNER_ALERT_INGEST_TOKEN: ${{ secrets.OWNER_ALERT_INGEST_TOKEN }}
        run: python3 scripts/dispatch_owner_updates.py

      - name: Commit owner delivery receipts
        if: always() && steps.owner_dispatch.outcome != 'skipped'
        env:
          COMMIT_MESSAGE: "chore: record owner alert delivery"
          MUST_STAGE: data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Open Global Dining alert issue
        if: always() && steps.global_alert.outputs.alert_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open_source_alert_issue.sh \
            "Global Dining source changed: review required" \
            /tmp/global-dining-alert.md \
            global-dining
