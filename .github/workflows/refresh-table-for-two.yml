name: Refresh Table for Two

on:
  schedule:
    # 06:00 Singapore time for the slower roster/source refresh.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: source-ledger-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Refresh public roster snapshot
        id: roster_refresh
        run: python3 scripts/scrape_table_for_two.py

      - name: Verify reviewed official document pages
        run: |
          python3 -m pip install --disable-pip-version-check pypdf==6.15.0
          python3 scripts/verify_tft_official_documents.py

      - name: Refresh and retain official menu versions
        id: menu_refresh
        run: python3 scripts/fetch_tft_menus.py --cache-dir ""

      - name: Build Telegram guide catalogue
        run: |
          python3 scripts/build_tft_guide_catalog.py
          python3 scripts/build_tft_slot_snapshot.py

      - name: Build Table for Two source alert
        id: table_for_two_alert
        run: |
          python3 scripts/source_change_alert.py \
            --program "Table for Two" \
            --meta data/table-for-two.json \
            --data data/table-for-two.json \
            --output /tmp/table-for-two-alert.md \
            --changelog data/changelog-table-for-two.md \
            --updates data/updates.json

      - name: Commit refreshed Table for Two data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/table-for-two.json data/table-for-two-slots.json data/updates.json reminders/app/tft_guide_catalog.json data/reviews/official-document-pdfs data/reviews/tft-menu-pdfs
          if [ -f data/changelog-table-for-two.md ]; then
            git add data/changelog-table-for-two.md
          fi
          if git diff --cached --quiet; then
            echo "No Table for Two changes detected."
            exit 0
          fi
          git commit -m "chore: refresh table for two data"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after remote sync."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Finalize source health
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            roster_outcome=success
          else
            roster_outcome=failure
          fi
          if [ "${{ job.status }}" = "success" ]; then
            menu_outcome=success
          else
            menu_outcome=failure
          fi
          python3 scripts/build_source_health.py --source table-for-two-roster --attempt-outcome "$roster_outcome"
          python3 scripts/build_source_health.py --source table-for-two-menus --attempt-outcome "$menu_outcome"

      - name: Commit source health
        if: always()
        env:
          COMMIT_MESSAGE: "chore: record Table for Two source health"
          MUST_STAGE: |
            data/source-health.json
            data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Dispatch published owner updates
        if: always()
        id: owner_dispatch
        env:
          OWNER_ALERT_INGEST_URL: ${{ secrets.OWNER_ALERT_INGEST_URL }}
          OWNER_ALERT_INGEST_TOKEN: ${{ secrets.OWNER_ALERT_INGEST_TOKEN }}
        run: python3 scripts/dispatch_owner_updates.py

      - name: Commit owner delivery receipts
        if: always() && steps.owner_dispatch.outcome != 'skipped'
        env:
          COMMIT_MESSAGE: "chore: record owner alert delivery"
          MUST_STAGE: data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Open Table for Two alert issue
        if: always() && steps.table_for_two_alert.outputs.alert_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open_source_alert_issue.sh \
            "Table for Two source changed: review required" \
            /tmp/table-for-two-alert.md \
            table-for-two
