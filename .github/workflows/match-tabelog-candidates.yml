name: Match Tabelog Candidates

on:
  schedule:
    # Monthly candidate sweep so the Japan Tabelog matches do not drift unseen.
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      offset:
        description: "Zero-based record offset"
        required: true
        default: "0"
      limit:
        description: "Number of restaurants to process"
        required: true
        default: "50"
      top:
        description: "Top candidates to keep per restaurant"
        required: true
        default: "5"
      pause:
        description: "Pause between requests in seconds"
        required: true
        default: "0.2"

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run Tabelog matcher batch
        env:
          PYTHONUNBUFFERED: "1"
          INPUT_OFFSET: ${{ inputs.offset || '0' }}
          INPUT_LIMIT: ${{ inputs.limit || '50' }}
          INPUT_TOP: ${{ inputs.top || '5' }}
          INPUT_PAUSE: ${{ inputs.pause || '0.2' }}
        run: |
          [[ "$INPUT_OFFSET" =~ ^[0-9]+$ ]] || { echo "offset must be an integer"; exit 2; }
          [[ "$INPUT_LIMIT" =~ ^[0-9]+$ ]] || { echo "limit must be an integer"; exit 2; }
          [[ "$INPUT_TOP" =~ ^[0-9]+$ ]] || { echo "top must be an integer"; exit 2; }
          [[ "$INPUT_PAUSE" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo "pause must be numeric"; exit 2; }
          mkdir -p artifacts
          python3 scripts/match_tabelog_candidates.py \
            --offset "$INPUT_OFFSET" \
            --limit "$INPUT_LIMIT" \
            --top "$INPUT_TOP" \
            --pause "$INPUT_PAUSE" \
            --output "artifacts/tabelog-candidates-${INPUT_OFFSET}-${INPUT_LIMIT}.json"

      - name: Upload matcher output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabelog-candidates-${{ inputs.offset || '0' }}-${{ inputs.limit || '50' }}
          path: artifacts/
