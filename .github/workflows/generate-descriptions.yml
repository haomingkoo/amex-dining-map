name: Generate AI Descriptions

on:
  schedule:
    # Runs on the 1st of every month at 02:00 UTC
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      min_words:
        description: "Regenerate descriptions shorter than N words (default: 20)"
        required: false
        default: "20"
      country:
        description: "Limit to a specific country (leave blank for all)"
        required: false
        default: ""
      batch_size:
        description: "Batch size per Groq request (default: 20)"
        required: false
        default: "20"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Run description generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INPUT_MIN_WORDS: ${{ github.event.inputs.min_words || '20' }}
          INPUT_BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
          INPUT_COUNTRY: ${{ github.event.inputs.country }}
        run: |
          [[ "$INPUT_MIN_WORDS" =~ ^[0-9]+$ ]] || { echo "min_words must be an integer"; exit 2; }
          [[ "$INPUT_BATCH_SIZE" =~ ^[0-9]+$ ]] || { echo "batch_size must be an integer"; exit 2; }
          args=(--min-words "$INPUT_MIN_WORDS" --batch-size "$INPUT_BATCH_SIZE")
          if [ -n "$INPUT_COUNTRY" ]; then
            args+=(--country "$INPUT_COUNTRY")
          fi
          python3 scripts/generate_global_descriptions.py "${args[@]}"

      - name: Commit updated descriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/global-restaurants.json
          git diff --staged --quiet || git commit -m "chore: regenerate AI descriptions for global restaurants"
          git push
