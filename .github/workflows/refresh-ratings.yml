name: Refresh Google Maps Ratings

on:
  schedule:
    # Every Sunday at 02:00 UTC — bounded rotation of missing or >90-day records
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      datasets:
        description: "Datasets to scrape (space-separated: global japan love tft stays)"
        required: false
        default: "global japan love tft stays"
      missing_only:
        description: "Only scrape records not yet in the ratings cache"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: source-ledger-refresh
  cancel-in-progress: false

jobs:
  refresh-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # full run can take up to 2 hours for ~2500 records

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.62.0
          playwright install chromium
          playwright install-deps chromium

      - name: Scrape ratings (bounded freshness rotation)
        id: source_refresh
        env:
          PYTHONUNBUFFERED: "1"
          INPUT_DATASETS: ${{ github.event.inputs.datasets || 'global japan love tft stays' }}
          INPUT_MISSING_ONLY: ${{ github.event.inputs.missing_only == 'true' && 'true' || 'false' }}
        run: |
          read -r -a datasets <<< "$INPUT_DATASETS"
          for dataset in "${datasets[@]}"; do
            case "$dataset" in global|japan|love|tft|stays) ;; *) echo "Unsupported dataset: $dataset"; exit 2 ;; esac
          done
          args=(--datasets "${datasets[@]}" --concurrency 2)
          if [ "$INPUT_MISSING_ONLY" = "true" ]; then
            args+=(--missing-only)
          else
            args+=(--max-age-days 90 --max-queries 250)
          fi
          python3 scripts/scrape_google_ratings_playwright.py "${args[@]}"

      - name: Commit updated ratings
        env:
          COMMIT_MESSAGE: "chore: refresh google maps ratings"
          MUST_STAGE: data/google-maps-ratings.json
          KEEP_LOCAL_ON_CONFLICT: data/google-maps-ratings.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Finalize source health
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            outcome=success
          else
            outcome=failure
          fi
          python3 scripts/build_source_health.py --source google-maps-ratings --attempt-outcome "$outcome"

      - name: Commit source health
        if: always()
        env:
          COMMIT_MESSAGE: "chore: record ratings source health"
          MUST_STAGE: |
            data/source-health.json
            data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Dispatch published owner updates
        if: always()
        id: owner_dispatch
        env:
          OWNER_ALERT_INGEST_URL: ${{ secrets.OWNER_ALERT_INGEST_URL }}
          OWNER_ALERT_INGEST_TOKEN: ${{ secrets.OWNER_ALERT_INGEST_TOKEN }}
        run: python3 scripts/dispatch_owner_updates.py

      - name: Commit owner delivery receipts
        if: always() && steps.owner_dispatch.outcome != 'skipped'
        env:
          COMMIT_MESSAGE: "chore: record owner alert delivery"
          MUST_STAGE: data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh
