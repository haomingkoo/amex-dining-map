name: Refresh Google Maps Ratings

on:
  schedule:
    # Every Sunday at 02:00 UTC — incremental (missing records only)
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      datasets:
        description: "Datasets to scrape (space-separated: global japan love)"
        required: false
        default: "global japan love"
      missing_only:
        description: "Only scrape records not yet in the ratings cache"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

concurrency:
  group: ratings-refresh
  cancel-in-progress: true

jobs:
  refresh-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # full run can take up to 2 hours for ~2500 records

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.62.0
          playwright install chromium
          playwright install-deps chromium

      - name: Scrape ratings (incremental)
        env:
          PYTHONUNBUFFERED: "1"
          INPUT_DATASETS: ${{ github.event.inputs.datasets || 'global japan love' }}
          INPUT_MISSING_ONLY: ${{ github.event.inputs.missing_only != 'false' && 'true' || 'false' }}
        run: |
          read -r -a datasets <<< "$INPUT_DATASETS"
          for dataset in "${datasets[@]}"; do
            case "$dataset" in global|japan|love) ;; *) echo "Unsupported dataset: $dataset"; exit 2 ;; esac
          done
          args=(--datasets "${datasets[@]}" --concurrency 2)
          if [ "$INPUT_MISSING_ONLY" = "true" ]; then
            args+=(--missing-only)
          fi
          python3 scripts/scrape_google_ratings_playwright.py "${args[@]}"

      - name: Commit updated ratings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/google-maps-ratings.json
          if git diff --cached --quiet; then
            echo "No ratings changes."
            exit 0
          fi
          COUNT=$(python3 -c "import json; print(len(json.load(open('data/google-maps-ratings.json'))))")
          git commit -m "chore: refresh google maps ratings ($COUNT records)"
          git push origin main
