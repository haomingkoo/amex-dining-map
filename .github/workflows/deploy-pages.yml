name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh Data
      - Refresh Global Dining Data
      - Refresh Love Dining
      - Refresh Table for Two
      - Table for Two Alerts
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Audit map coordinates
        run: python3 scripts/audit_coordinates.py

      - name: Audit content provenance
        run: python3 scripts/audit_content_provenance.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage Static Site
        run: |
          mkdir -p site
          cp -R web/. site/
          mkdir -p site/data
          for file in \
            japan-restaurants.json \
            japan-dining-source.json \
            pocket-availability.json \
            global-restaurants.json \
            global-dining-source.json \
            plat-stays.json \
            plat-stay-source.json \
            love-dining.json \
            love-dining-source.json \
            table-for-two.json \
            google-maps-ratings.json
          do
            cp "data/${file}" site/data/
          done
          cp .nojekyll site/
          cp CNAME site/
          short_sha="${GITHUB_SHA::7}"
          sed -i "s/?v=dev/?v=${short_sha}/g" site/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy attempt 1
        id: deploy_1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deploy retry
        if: steps.deploy_1.outcome == 'failure'
        run: sleep 45

      - name: Deploy attempt 2
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final deploy retry
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: sleep 90

      - name: Deploy attempt 3
        id: deployment
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
