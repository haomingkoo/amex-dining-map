name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh Data
      - Refresh Global Dining Data
      - Refresh Love Dining
      - Refresh Table for Two
      - Table for Two Alerts
      - Monitor Source Health
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Audit map coordinates
        run: python3 scripts/audit_coordinates.py

      - name: Audit content provenance
        run: python3 scripts/audit_content_provenance.py

      - name: Test Table for Two reliability
        run: |
          python3 -m unittest \
            scripts.tests.test_table_for_two_retry \
            scripts.tests.test_table_for_two_data \
            scripts.tests.test_public_data_projections
          for test_file in scripts/tests/test_table_for_two_*.js; do
            node "$test_file"
          done
          node scripts/tests/test_tft_public_payloads.js

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Stage Static Site
        env:
          TELEGRAM_GUIDE_BOT_USERNAME: ${{ vars.TELEGRAM_GUIDE_BOT_USERNAME }}
        run: |
          mkdir -p site
          cp -R web/. site/
          mkdir -p site/data
          for file in \
            japan-restaurants.json \
            japan-dining-source.json \
            pocket-availability.json \
            global-restaurants.json \
            global-dining-source.json \
            plat-stays.json \
            plat-stay-source.json \
            love-dining.json \
            love-dining-source.json \
            table-for-two.json \
            table-for-two-slots.json \
            table-for-two-release-history.json \
            updates.json \
            source-health.json \
            google-maps-ratings.json \
            telegram-guide.json
          do
            cp "data/${file}" site/data/
          done
          # The reminders service reads this back at runtime so its copy cannot
          # drift from the site between manual redeploys.
          cp reminders/app/tft_guide_catalog.json site/data/tft_guide_catalog.json
          python3 scripts/build_telegram_public_config.py --output site/data/telegram-guide.json
          python3 scripts/build_public_data_projections.py \
            --table-for-two data/table-for-two.json \
            --ratings data/google-maps-ratings.json \
            --release-history data/table-for-two-release-history.json \
            --tft-catalog-output site/data/table-for-two-catalog.json \
            --tft-ratings-output site/data/google-maps-ratings-table-for-two.json \
            --release-summary-output site/data/table-for-two-release-history-summary.json
          cp .nojekyll site/
          cp CNAME site/
          app_version="$(sha256sum site/app.js | cut -c1-12)"
          styles_version="$(sha256sum site/styles.css | cut -c1-12)"
          sed -i "s/app.js?v=dev/app.js?v=${app_version}/g" site/index.html
          sed -i "s/styles.css?v=dev/styles.css?v=${styles_version}/g" site/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Wait for Pages deployment slot
        run: sleep 60

      - name: Deploy attempt 1
        id: deploy_1
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait before deploy retry
        if: steps.deploy_1.outcome == 'failure'
        run: sleep 45

      - name: Deploy attempt 2
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait before final deploy retry
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: sleep 90

      - name: Deploy attempt 3
        id: deployment
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Dispatch Telegram reminders from deployed snapshot
        if: ${{ always() && (steps.deploy_1.outcome == 'success' || steps.deploy_2.outcome == 'success' || steps.deployment.outcome == 'success') }}
        env:
          REMINDERS_API_BASE: ${{ secrets.REMINDERS_API_BASE }}
          TELEGRAM_REMINDER_DISPATCH_TOKEN: ${{ secrets.TELEGRAM_REMINDER_DISPATCH_TOKEN }}
          TELEGRAM_REMINDERS_EXPECTED_ENABLED: ${{ vars.TELEGRAM_REMINDERS_EXPECTED_ENABLED }}
        run: bash scripts/dispatch-telegram-reminders.sh
