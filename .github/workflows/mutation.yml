name: Mutation tests

# Not a required check yet. Fails when the tests miss too many mutants of the Python files a PR changed.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reminders/requirements-dev.txt

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r reminders/requirements-dev.txt

      - name: Mutation-test changed Python files
        run: python3 .github/scripts/mutation_gate.py --base "origin/${{ github.base_ref }}" --threshold 80
