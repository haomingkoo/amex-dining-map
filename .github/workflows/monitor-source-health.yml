name: Monitor Source Health

on:
  # GitHub drops most of these; kept as the fallback when Table for Two Alerts stops.
  schedule:
    - cron: "22,52 * * * *"
  # Railway dispatches Table for Two Alerts about every 15 minutes; the gate thins this to one pass per ~30 minutes.
  workflow_run:
    workflows:
      - Table for Two Alerts
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  gate:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check time since the last monitor pass
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/monitor_due.py

  monitor:
    needs: gate
    if: ${{ !cancelled() && (github.event_name != 'workflow_run' || needs.gate.outputs.due == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Own group: a shared one keeps one pending run, so a monitor would cancel a queued refresh.
    # Writes to shared ledgers are serialised by commit_and_push.sh's rebase and ledger merge.
    concurrency:
      group: source-health-monitor
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Availability freshness is Railway's live snapshot age, not a committed timestamp.
      - name: Recompute source health
        run: python3 scripts/build_source_health.py --tft-live-url https://amex-reminders-production.up.railway.app/healthz

      - name: Commit source-health transitions
        env:
          COMMIT_MESSAGE: "chore: update source health"
          MUST_STAGE: |
            data/source-health.json
            data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Dispatch published owner updates
        id: owner_dispatch
        env:
          OWNER_ALERT_INGEST_URL: ${{ secrets.OWNER_ALERT_INGEST_URL }}
          OWNER_ALERT_INGEST_TOKEN: ${{ secrets.OWNER_ALERT_INGEST_TOKEN }}
        run: python3 scripts/dispatch_owner_updates.py

      - name: Commit owner delivery receipts
        if: always() && steps.owner_dispatch.outcome != 'skipped'
        env:
          COMMIT_MESSAGE: "chore: record owner alert delivery"
          MUST_STAGE: data/updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_and_push.sh

      - name: Check live Table for Two freshness
        if: always()
        run: python3 scripts/check_tft_live_health.py

      - name: Retry or escalate stale sources
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/watchdog_stale_sources.py
